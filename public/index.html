<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONFINAMENTO Online</title><style>:root{font-family:system-ui,Arial;color:#f7ebce;background:#17150f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#4e3822,#17150f 65%);min-height:100vh}header{text-align:center;padding:36px 16px 20px;border-bottom:2px solid #a78140}h1{font-family:Georgia,serif;letter-spacing:3px;font-size:clamp(32px,6vw,65px);margin:0;color:#f6c979;text-shadow:2px 3px #492716}small{color:#e8bd76}.wrap{max-width:1050px;margin:20px auto;padding:16px}.panel{background:#272219;border:1px solid #7c623a;border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:0 9px 28px #0004}input,button{font:inherit;padding:12px 15px;border-radius:8px;border:1px solid #a78140}input{background:#120f0b;color:white;max-width:100%;margin:5px}button{background:#d6a85b;color:#1a120a;font-weight:750;cursor:pointer;margin:4px}button:hover{background:#f3ca81}button:disabled{opacity:.35;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.player{background:#362b20;border:1px solid #655034;padding:14px;border-radius:10px}.muted{color:#b7a78d}.tag{display:inline-block;background:#5c482e;padding:4px 8px;border-radius:20px;font-size:12px}.dead{opacity:.4}.hidden{display:none}.log{max-height:220px;overflow:auto}.red{color:#f4a2a2}.center{text-align:center}</style></head><body><header><h1>CONFINAMENTO</h1><small>ONLINE · EDIÇÃO RÚSTICA · PRÉVIA MULTIPLAYER</small></header><div class="wrap"><section id="enter" class="panel center"><h2>Entre no confinamento</h2><p>Crie uma sala ou use o código de um amigo.</p><input id="name" placeholder="Seu nome" maxlength="24"><input id="room" placeholder="Código da sala (opcional)" maxlength="24"><p><button id="join">Entrar / Criar sala</button></p><p class="muted">Esta é uma prévia online: provas, Arca e regras completas ainda serão integradas.</p></section><main id="game" class="hidden"><div class="panel"><h2>Sala <span id="code"></span> <button id="copy">Copiar convite</button></h2><p id="status"></p><p id="timer"></p><div id="teams"><h3>Escolha sua equipe</h3><button data-team="Avestruz">🪶 Avestruz</button><button data-team="Coelho">🐇 Coelho</button><button data-team="Ovelha">🐑 Ovelha</button></div><div id="host"></div></div><div class="panel"><h2>Participantes</h2><div id="players" class="grid"></div></div><div class="panel"><h2>Roça e votação</h2><div id="roca" class="grid"></div></div><div class="panel"><h2>Aconteceu na fazenda</h2><div id="log" class="log"></div></div></main></div><script src="/socket.io/socket.io.js"></script><script>const socket=io();let me='',room='',state=null,voted=false;const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));el('join').onclick=()=>socket.emit('join',{name:el('name').value,room:el('room').value},r=>{if(r.error)return alert(r.error);me=r.id;room=r.room;el('enter').classList.add('hidden');el('game').classList.remove('hidden');el('code').textContent=room;history.replaceState(null,'','?sala='+encodeURIComponent(room))});el('room').value=new URLSearchParams(location.search).get('sala')||'';el('copy').onclick=()=>{navigator.clipboard.writeText(location.origin+'/?sala='+room);alert('Convite copiado!')};document.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>socket.emit('team',b.dataset.team));socket.on('voted',()=>{voted=true;render()});socket.on('state',s=>{if(state?.stage!==s.stage)voted=false;state=s;render()});function render(){const s=state;if(!s)return;const stage={lobby:'Aguardando participantes',social:'Convivência',nominate:'Formação da Roça',publicVote:'Votação para salvar',results:'Resultado',finished:'Final'};el('status').innerHTML='<b>Semana '+s.week+' — '+(stage[s.stage]||s.stage)+'</b>';el('teams').style.display=s.stage==='lobby'?'block':'none';el('host').innerHTML=s.host===me&&s.stage==='lobby'?'<button id="start">Começar temporada com bots</button>':'';if(el('start'))el('start').onclick=()=>socket.emit('start');el('players').innerHTML=s.players.map(p=>'<div class="player '+(p.eliminated?'dead':'')+'"><b>'+esc(p.name)+'</b> '+(p.bot?'<span class="tag">BOT</span>':'')+'<p class="muted">'+esc(p.team||'Sem equipe')+'</p>'+(p.eliminated?'<span class="red">Eliminado</span>':'')+'</div>').join('');el('roca').innerHTML=s.stage==='nominate'&&s.host===me?s.players.filter(p=>!p.eliminated&&!s.roca.includes(p.id)).map(p=>'<div class="player"><b>'+esc(p.name)+'</b><p><button data-nom="'+esc(p.id)+'">Indicar</button></p></div>').join(''):s.roca.map(id=>{const p=s.players.find(x=>x.id===id);return '<div class="player"><h3>'+esc(p?.name||id)+'</h3>'+(s.stage==='publicVote'?'<button data-vote="'+esc(id)+'" '+(voted?'disabled':'')+'>Salvar</button>':'')+(s.stage==='results'?'<p>Votos: '+(s.votes[id]||0)+'</p>':'')+'</div>'}).join('')||(s.stage==='social'?'<p>Os peões estão convivendo. A Roça vem a seguir.</p>':'<p>Aguardando formação da Roça.</p>');document.querySelectorAll('[data-nom]').forEach(b=>b.onclick=()=>socket.emit('nominate',b.dataset.nom));document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>socket.emit('vote',b.dataset.vote));el('log').innerHTML=s.log.slice().reverse().map(x=>'<p>• '+esc(x)+'</p>').join('');if(s.winner){const p=s.players.find(p=>p.id===s.winner);el('status').innerHTML+='<h2>🏆 Vencedor: '+esc(p?.name||'')+'</h2>'}}setInterval(()=>{if(state&&state.ends&&state.stage!=='lobby'&&state.stage!=='finished')el('timer').textContent='Tempo restante: '+Math.max(0,Math.ceil((state.ends-Date.now())/1000))+'s';else el('timer').textContent=''},500);</script></body></html>
